<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Instal·lacions BT</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102746;background:#f4f7fb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);padding:36px;background:#fff;border:1px solid #d8e2ef;border-radius:18px;text-align:center;box-shadow:0 18px 55px rgba(12,42,83,.12)}
    img{display:block;width:min(440px,100%);height:auto;margin:0 auto 24px}
    h1{margin:0 0 12px}.copy{color:#66778e;line-height:1.6}.button{display:inline-block;margin-top:20px;text-decoration:none;background:#2442c4;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img src="/asesor-energetico/assets/capcalera-documents.png" alt="Instal·lacions BT"/>
    <h1>Página no encontrada</h1>
    <p class="copy">La dirección solicitada no existe. Si venías de un correo de confirmación, estamos comprobando automáticamente si podemos recuperar el proceso.</p>
    <a class="button" href="/asesor-energetico/">Volver al acceso</a>
  </main>
  <script>
    (function(){
      const raw=location.search+' '+location.hash;
      const authCallback=/(access_token|refresh_token|error|error_code|error_description|code|token_hash)=/i.test(raw);
      if(!authCallback)return;
      const target='https://guimi77.github.io/asesor-energetico/registro-completado.html'+location.search+location.hash;
      location.replace(target);
    })();
  </script>
</body>
</html>
