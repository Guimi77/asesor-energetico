<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Energia BT · Confirmación de correo</title>
  <link rel="stylesheet" href="styles.css?v=8095d3a666fd"/>
  <link rel="stylesheet" href="auth.css?v=7e6a616f7cd6"/>
  <link rel="stylesheet" href="bt-action-theme.css?v=93d27f214ea0"/>
  <style>
    .confirmation-shell{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(circle at top,#e6fbf7 0,#f5f8f8 44%,#e8efef 100%)}
    .confirmation-shell .auth-card{width:min(520px,100%);padding:32px;text-align:center}
    .confirmation-shell .auth-logo{width:min(210px,70%);max-height:205px;margin:0 auto 18px;object-fit:contain}
    .confirmation-shell .eyebrow{margin:0 0 8px}
    .confirmation-shell h1{color:#1d292d;font-size:clamp(1.5rem,4.5vw,1.9rem);line-height:1.2}
    .confirmation-shell .auth-copy{max-width:425px;margin:12px auto 0;font-size:.88rem;line-height:1.55;overflow-wrap:anywhere}
    .confirmation-shell .auth-result-icon{margin:18px auto 16px;background:#e8faf7;color:#007d78}
    .confirmation-shell .auth-result-icon.ok{background:#e7f7ed;color:#16713b}
    .confirmation-shell .auth-result-icon.error{background:#fff0ed;color:#b42318}
    .confirmation-shell .confirmation-notice{margin:20px 0 0;padding:15px 16px;border:1px solid #d7e4e2;border-radius:9px;background:#f3faf8;color:#40565a;text-align:left;font-size:.82rem;line-height:1.55;overflow-wrap:anywhere}
    .confirmation-shell .confirmation-notice strong{color:#1d292d}
    .confirmation-shell .confirmation-actions{margin-top:22px}
    .confirmation-shell .confirmation-button{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:10px 17px;border:1px solid #007b73;border-radius:7px;background:#008b83;color:#fff;font-weight:800;text-decoration:none}
    .confirmation-shell .confirmation-button:hover{background:#006b66}
    .confirmation-shell .confirmation-button:focus-visible{outline:3px solid rgba(0,139,131,.30);outline-offset:3px}
    .confirmation-shell .confirmation-footnote{margin:18px auto 0;max-width:430px;font-size:.72rem;line-height:1.5;color:#65758a}
    @media(max-width:600px){.confirmation-shell{padding:18px 12px}.confirmation-shell .auth-card{padding:24px 20px}.confirmation-shell .auth-logo{width:min(190px,68%)}}
  </style>
</head>
<body>
  <main class="confirmation-shell">
    <section class="auth-card auth-result" aria-live="polite" aria-atomic="true">
      <img class="auth-logo" src="assets/energia-bt-inferior.jpg?v=628006832ae8" alt="Energia BT"/>
      <p class="eyebrow">Acceso privado · Asesor Energético</p>
      <div id="stateIcon" class="auth-result-icon" aria-hidden="true">…</div>
      <h1 id="title">Comprobando el registro…</h1>
      <p id="message" class="auth-copy">Estamos verificando la confirmación de tu correo electrónico.</p>
      <div id="notice" class="confirmation-notice" hidden></div>
      <div class="confirmation-actions"><a class="confirmation-button" href="./">Volver al acceso</a></div>
      <p class="confirmation-footnote">El acceso a los datos energéticos está protegido y depende de los permisos asignados a cada cuenta.</p>
    </section>
  </main>
  <script type="module" src="auth.js?v=20260915-confirm1"></script>
  <script type="module">
    const $=id=>document.getElementById(id);
    const waitForClient=async()=>{
      for(let i=0;i<100;i++){
        if(window.ibtSupabase)return window.ibtSupabase;
        await new Promise(r=>setTimeout(r,25));
      }
      throw new Error('Cliente de autenticación no disponible');
    };
    function paramsFromLocation(){
      const out=new URLSearchParams(location.search);
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      for(const [k,v] of hash.entries())if(!out.has(k))out.set(k,v);
      return out;
    }
    function render(kind,title,message,notice){
      const icon=$('stateIcon');
      icon.className=`auth-result-icon ${kind}`;
      icon.textContent=kind==='ok'?'✓':'!';
      $('title').textContent=title;
      $('message').textContent=message;
      if(notice){$('notice').hidden=false;$('notice').innerHTML=notice;}
    }
    function cleanAddress(){history.replaceState({},document.title,location.pathname);}

    async function notifyAdmin(supabase){
      try{
        const {data,error}=await supabase.functions.invoke('notify-new-registration',{body:{}});
        if(error){console.warn('No se pudo avisar al administrador',error);return false;}
        return data?.ok===true;
      }catch(err){
        console.warn('No se pudo avisar al administrador',err);
        return false;
      }
    }

    async function verifyConfirmation(){
      const params=paramsFromLocation();
      const authError=params.get('error_description')||params.get('error');
      if(authError){
        cleanAddress();
        render('error','No se ha podido confirmar el registro',decodeURIComponent(authError.replace(/\+/g,' ')),'<strong>Qué hacer:</strong> vuelve al acceso e intenta iniciar sesión. Si no puedes entrar, contacta con Instal·lacions BT.');
        return;
      }
      const supabase=await waitForClient();
      if(params.get('code')){
        const {error}=await supabase.auth.exchangeCodeForSession(params.get('code'));
        if(error){
          cleanAddress();
          render('error','No se ha podido confirmar el registro',error.message,'<strong>El enlace puede haber caducado o haberse utilizado ya.</strong> Si ya puedes iniciar sesión, tu correo probablemente quedó confirmado anteriormente.');
          return;
        }
      }
      const {data,error}=await supabase.auth.getUser();
      if(error||!data?.user){
        cleanAddress();
        render('error','No podemos verificar la confirmación','No hemos recibido una sesión válida que demuestre que el enlace de confirmación haya terminado correctamente.','<strong>No mostramos “registro completado” por suposición.</strong> Vuelve al acceso e intenta iniciar sesión; si falla, contacta con Instal·lacions BT.');
        return;
      }
      const email=data.user.email||'tu correo';
      const {data:profile, error:profileError}=await supabase.from('profiles')
        .select('role,active').eq('id',data.user.id).maybeSingle();
      if(profileError)console.warn('No se pudo comprobar el perfil tras confirmar el correo',profileError);
      if(profile?.role==='client'&&profile.active===false)await notifyAdmin(supabase);
      cleanAddress();
      await supabase.auth.signOut({scope:'local'}).catch(()=>{});
      const pending=profile?.role==='client'&&profile.active===false;
      const enabled=profile?.active===true;
      const notice=pending
        ? '<strong>Siguiente paso:</strong> Un administrador vinculará manualmente tu cuenta con tu ficha y tus CUPS. Te avisaremos cuando tengas acceso.'
        : enabled
          ? '<strong>Siguiente paso:</strong> Ya puedes volver al acceso e iniciar sesión con tu correo y contraseña.'
          : '<strong>Siguiente paso:</strong> Tu correo está confirmado. Si aún no puedes acceder, consulta al administrador para comprobar los permisos de tu cuenta.';
      render('ok','Correo confirmado','El correo '+email+' se ha confirmado correctamente.',notice);
    }
    verifyConfirmation().catch(err=>{
      console.error(err);
      cleanAddress();
      render('error','No podemos verificar la confirmación','Se ha producido un error al comprobar el registro.','<strong>Por seguridad no damos el registro por completado sin verificarlo.</strong> Vuelve al acceso e intenta iniciar sesión.');
    });
  </script>
</body>
</html>
