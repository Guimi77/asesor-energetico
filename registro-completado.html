<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Instal·lacions BT · Confirmación de correo</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b2447;background:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#edf3fb 0%,#f8fafc 100%)}
    .card{width:min(620px,100%);background:#fff;border:1px solid #d8e2ef;border-radius:18px;box-shadow:0 18px 55px rgba(12,42,83,.12);padding:36px;text-align:center}
    .logo{display:block;width:min(440px,100%);height:auto;margin:0 auto 26px}
    .eyebrow{margin:0 0 8px;color:#2442c4;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;color:#102746;font-size:clamp(1.8rem,5vw,2.5rem)}
    .copy{margin:16px auto 0;max-width:520px;color:#5e718a;line-height:1.65;font-size:1rem}
    .state{width:72px;height:72px;margin:24px auto 18px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:900;background:#e9eef8;color:#2442c4}
    .state.ok{background:#e6f7ed;color:#11743a}
    .state.error{background:#fff0ed;color:#b42318}
    .notice{margin:22px 0 0;padding:15px 16px;border-radius:12px;background:#f7f9fc;color:#52647b;text-align:left;line-height:1.5}
    .notice strong{color:#102746}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
    .button{display:inline-block;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:800;border:1px solid #2442c4;background:#2442c4;color:#fff}
    .small{margin-top:18px;color:#7a8ba2;font-size:.86rem}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <img class="logo" src="assets/capcalera-documents.png" alt="Instal·lacions BT"/>
    <p class="eyebrow">Confirmación de correo</p>
    <div id="stateIcon" class="state">…</div>
    <h1 id="title">Comprobando el registro…</h1>
    <p id="message" class="copy">Estamos verificando que el correo haya quedado confirmado correctamente.</p>
    <div id="notice" class="notice" hidden></div>
    <div class="actions"><a class="button" href="./">Volver al acceso</a></div>
    <p class="small">Por seguridad, un cliente nuevo no verá ningún suministro hasta que Instal·lacions BT vincule manualmente su cuenta.</p>
  </main>

  <script type="module" src="auth.js?v=20260915-confirm1"></script>
  <script type="module">
    const $=id=>document.getElementById(id);
    const waitForClient=async()=>{
      for(let i=0;i<100;i++){
        if(window.ibtSupabase)return window.ibtSupabase;
        await new Promise(r=>setTimeout(r,25));
      }
      throw new Error('Cliente de autenticación no disponible');
    };
    function paramsFromLocation(){
      const out=new URLSearchParams(location.search);
      const hash=new URLSearchParams(location.hash.replace(/^#/,''));
      for(const [k,v] of hash.entries())if(!out.has(k))out.set(k,v);
      return out;
    }
    function render(kind,title,message,notice){
      const icon=$('stateIcon');
      icon.className=`state ${kind}`;
      icon.textContent=kind==='ok'?'✓':'!';
      $('title').textContent=title;
      $('message').textContent=message;
      if(notice){$('notice').hidden=false;$('notice').innerHTML=notice;}
    }
    function cleanAddress(){history.replaceState({},document.title,location.pathname);}

    async function notifyAdmin(supabase){
      try{
        const {data,error}=await supabase.functions.invoke('notify-new-registration',{body:{}});
        if(error){console.warn('No se pudo avisar al administrador',error);return false;}
        return data?.ok===true;
      }catch(err){
        console.warn('No se pudo avisar al administrador',err);
        return false;
      }
    }

    async function verifyConfirmation(){
      const params=paramsFromLocation();
      const authError=params.get('error_description')||params.get('error');
      if(authError){
        cleanAddress();
        render('error','No se ha podido confirmar el registro',decodeURIComponent(authError.replace(/\+/g,' ')),'<strong>Qué hacer:</strong> vuelve al acceso e intenta iniciar sesión. Si no puedes entrar, contacta con Instal·lacions BT.');
        return;
      }
      const supabase=await waitForClient();
      if(params.get('code')){
        const {error}=await supabase.auth.exchangeCodeForSession(params.get('code'));
        if(error){
          cleanAddress();
          render('error','No se ha podido confirmar el registro',error.message,'<strong>El enlace puede haber caducado o haberse utilizado ya.</strong> Si ya puedes iniciar sesión, tu correo probablemente quedó confirmado anteriormente.');
          return;
        }
      }
      const {data,error}=await supabase.auth.getUser();
      if(error||!data?.user){
        cleanAddress();
        render('error','No podemos verificar la confirmación','No hemos recibido una sesión válida que demuestre que el enlace de confirmación haya terminado correctamente.','<strong>No mostramos “registro completado” por suposición.</strong> Vuelve al acceso e intenta iniciar sesión; si falla, contacta con Instal·lacions BT.');
        return;
      }
      const email=data.user.email||'tu correo';
      const notified=await notifyAdmin(supabase);
      cleanAddress();
      await supabase.auth.signOut({scope:'local'}).catch(()=>{});
      const notice=notified
        ? '<strong>Siguiente paso:</strong> Instal·lacions BT ya ha recibido tu solicitud. Un administrador vinculará manualmente tu cuenta con tu ficha y tus CUPS. Te avisaremos cuando puedas entrar.'
        : '<strong>Siguiente paso:</strong> tu correo está confirmado, pero tu solicitud sigue pendiente. Contacta con Instal·lacions BT si necesitas comprobar su estado.';
      render('ok','Registro completado','El correo '+email+' ha quedado confirmado correctamente. Tu solicitud de acceso sigue pendiente de aprobación.',notice);
    }
    verifyConfirmation().catch(err=>{
      console.error(err);
      cleanAddress();
      render('error','No podemos verificar la confirmación','Se ha producido un error al comprobar el registro.','<strong>Por seguridad no damos el registro por completado sin verificarlo.</strong> Vuelve al acceso e intenta iniciar sesión.');
    });
  </script>
</body>
</html>
