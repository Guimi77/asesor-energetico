name: Users directory regression

on:
  push:
    paths:
      - 'client-search.js'
      - '.github/workflows/users-directory-regression.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and user directory checks
        run: |
          node --check client-search.js
          grep -q "id='userSearch'\|id=\"userSearch\"\|input.id='userSearch'" client-search.js
          grep -q "localeCompare" client-search.js
          grep -q "cliente asignado" client-search.js
