name: One-shot completeness finalizer
on:
  push:
    branches: [tmp-completeness-safety-6]
    paths: ['.github/workflows/one-shot-completeness-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-completeness-safety-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch FENIE completeness safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('xtra-history.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              s=s.replace(old,new,1)
          once("const COMPLETENESS_VERSION='fenie-2026.09.09.1';","const COMPLETENESS_VERSION='fenie-2026.09.09.2';",'version')
          once("const norm=v=>String(v??'').trim();","const norm=v=>String(v??'').trim();\nconst clean=v=>norm(v).replace(/\\s+/g,' ');",'clean helper')
          once("const euros=s=>[...String(s||'').matchAll(/(-?[\\d.]+,\\d{2})\\s*€/g)].map(m=>num(m[1]));","const euros=s=>[...String(s||'').matchAll(/(-?[\\d.]+,\\d{2})\\s*€(?!\\s*\\/)/g)].map(m=>num(m[1]));",'euros')
          new_rights=r'''function rightsDetail(a,total){
            const signal=/Derechos (?:de )?(Verificaci[oó]n|Extensi[oó]n|Acceso|Enganche|Actuaci[oó]n Equipos) Distribuidora/ig;
            const block=[];let active=false;
            for(const line of a){
              signal.lastIndex=0;
              if(signal.test(line)){active=true;block.push(line);continue}
              if(active){if(/^(?:Impuesto electricidad|Alquiler Equipo|IVA\b|IGIC\b|TOTAL FACTURA)/i.test(line))break;block.push(line)}
            }
            const text=clean(block.join(' '));
            if(!text)return {text:'',items:[],status:'not_present',residual:0};
            signal.lastIndex=0;
            const matches=[...text.matchAll(signal)],items=[];
            for(let i=0;i<matches.length;i++){
              const m=matches[i],start=m.index??0,end=i+1<matches.length?(matches[i+1].index??text.length):text.length;
              const segment=text.slice(start,end),amountMatch=segment.match(/\((-?[\d.]+,\d{2})\s*€\)/i);
              if(!amountMatch)continue;
              const legal=(segment.match(/\(([^\)]*(?:R\.D\.|Art\.)[^\)]*)\)/i)||[])[1]||null;
              items.push({concept:`Derechos ${m[1]} Distribuidora`,amount_eur:num(amountMatch[1]),category:'distributor_right',legal_reference:legal,source_text:segment.slice(0,220)});
            }
            if(!items.length&&matches.length===1&&Number(total)!==0){
              const segment=text.slice(matches[0].index??0),legal=(segment.match(/\(([^\)]*(?:R\.D\.|Art\.)[^\)]*)\)/i)||[])[1]||null;
              items.push({concept:`Derechos ${matches[0][1]} Distribuidora`,amount_eur:Number(total),category:'distributor_right',legal_reference:legal,source_text:segment.slice(0,220)});
            }
            const known=round2(items.reduce((sum,item)=>sum+Number(item.amount_eur||0),0));
            const residual=round2(Number(total||0)-known);
            if(Math.abs(residual)>.05){
              items.push({concept:'Derecho distribuidora no identificado',amount_eur:residual,category:'distributor_right_unidentified',legal_reference:null,source_text:text.slice(0,220)});
              return {text,items,status:'needs_review',residual};
            }
            return {text,items,status:items.length?'extracted':'needs_review',residual:0};
          }'''
          pat=r'function rightsDetail\(a,total\)\{.*?\n\}\nasync function readPdf'
          s2,n=re.subn(pat,lambda m:new_rights+'\nasync function readPdf',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'rightsDetail replacement: {n}')
          s=s2
          s,n=re.subn(r'\n?const rightsComplete=rights\.items\.length>0&&same\(rights\.items\.reduce\(\(sum,item\)=>sum\+Number\(item\.amount_eur\|\|0\),0\),distributorCharges,\.05\);','',s,count=1)
          if n!=1: raise SystemExit(f'rightsComplete removal: {n}')
          once('if(rightsComplete)adjustments.push(...rights.items);','', 'rights adjustment duplication')
          once("tax_lines:taxLines.length?'extracted':'unreliable',distributor_rights:rights.text?(rightsComplete?'extracted':'unreliable'):'not_present',","tax_lines:taxLines.length?'extracted':'unreliable',distributor_rights:rights.status,",'rights completeness')
          once("const assessment=Object.values(completeness).some(v=>v==='unreliable')?'needs_review':'complete';","const assessment=Object.values(completeness).some(v=>v==='unreliable'||v==='needs_review')?'needs_review':'complete';",'assessment')
          once("taxLines,adjustments,distributor,retailer:'FENIE ENERGIA'","taxLines,adjustments,distributorRights:rights.items,distributor,retailer:'FENIE ENERGIA'",'return rights')
          once("tax_lines:x.taxLines,adjustments:x.adjustments};","tax_lines:x.taxLines,distributor_rights:x.distributorRights,adjustments:x.adjustments};",'payload rights')
          p.write_text(s)

          t=Path('tests/xtra-completeness.test.cjs')
          q=t.read_text()
          q=q.replace('globalThis.api={status,excessRows,reactiveRows,taxRows,rightsDetail};','globalThis.api={status,euros,excessRows,reactiveRows,taxRows,rightsDetail};')
          q=q.replace("for(const state of ['extracted','not_present','not_applicable','unreliable'])","for(const state of ['extracted','not_present','not_applicable','unreliable','needs_review'])")
          anchor="test('Distributor rights are only itemized when source allocation is explicit',()=>{"
          start=q.index(anchor)
          end=q.index("test('Structured payload carries completeness detail",start)
          block="""test('Monetary extraction never mistakes unit prices for billed euros',()=>{\n const values=plain(ctx.api.euros('0,123456 €/kWh 0,20 €/kWh = 15,47 €'));\n assert.deepEqual(values,[15.47]);\n});\ntest('Distributor rights keep explicit detail and surface any unknown residual',()=>{\n const one=plain(ctx.api.rightsDetail(['Derechos Actuación Equipos Distribuidora (R.D. 1048/2013, Art. 29). 9,04 €'],9.04));\n assert.equal(one.status,'extracted');assert.equal(one.items.length,1);assert.equal(one.items[0].amount_eur,9.04);\n const truncated=plain(ctx.api.rightsDetail(['Derechos de Verificación Distribuidora (R.D. 1048/2013, Art. 29). (8,01€).Derechos de Extensión Distribuidora (R.D.','1048/2013, Art. 25). (39,09€).Derechos Actuación Equipos Distribuidora (R.D. 1048/2013, Art. 29). (9,04€).Derechos de 91,43 €'],91.43));\n assert.equal(truncated.status,'needs_review');assert.equal(truncated.items.length,4);\n assert.equal(truncated.items.at(-1).concept,'Derecho distribuidora no identificado');assert.equal(truncated.items.at(-1).amount_eur,35.29);\n assert(!source.includes('adjustments.push(...rights.items)'));\n assert(source.includes('distributor_rights:rights.status'));\n});\n"""
          q=q[:start]+block+q[end:]
          q=q.replace("'tax_lines:x.taxLines','adjustments:x.adjustments'","'tax_lines:x.taxLines','distributor_rights:x.distributorRights','adjustments:x.adjustments'")
          t.write_text(q)

          u=Path('tests/pdf-lifecycle.test.cjs')
          r=u.read_text()
          r=r.replace("'tax_lines:x.taxLines','adjustments:x.adjustments'","'tax_lines:x.taxLines','distributor_rights:x.distributorRights','adjustments:x.adjustments'")
          r=r.replace("const COMPLETENESS_VERSION='fenie-2026.09.09.1'","const COMPLETENESS_VERSION='fenie-2026.09.09.2'")
          r=r.replace("for(const state of [\"'extracted'\",\"'not_present'\",\"'not_applicable'\",\"'unreliable'\"])","for(const state of [\"'extracted'\",\"'not_present'\",\"'not_applicable'\",\"'unreliable'\",\"'needs_review'\"])")
          r=r.replace('assert(s.includes("if(rightsComplete)adjustments.push(...rights.items);"));','assert(!s.includes("adjustments.push(...rights.items)"));')
          r=r.replace('assert(s.includes("distributor_rights:rights.text?(rightsComplete?\'extracted\':\'unreliable\'):\'not_present\'"));','assert(s.includes("distributor_rights:rights.status"));')
          u.write_text(r)
          PY
      - name: Run parser regression suite
        run: |
          node --check app.js
          node --check parser-audit.js
          node --test tests/power-regression.test.cjs tests/pdf-lifecycle.test.cjs tests/xtra-completeness.test.cjs
          git diff --check
      - name: Commit tested patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-completeness-finalize.yml
          git config user.name 'Guimi77'
          git config user.email 'tecnico1@electricabt.com'
          git add xtra-history.js tests/xtra-completeness.test.cjs tests/pdf-lifecycle.test.cjs .github/workflows/one-shot-completeness-finalize.yml
          git commit -m 'Finalize FENIE completeness persistence'
          git push origin HEAD:tmp-completeness-safety-6
