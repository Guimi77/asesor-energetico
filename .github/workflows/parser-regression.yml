name: Parser regression
on:
  push:
    paths: ['app.js', 'xtra-history.js', 'parser-audit.js', 'bulk-performance.js', 'folder-upload.js', 'supply-lifecycle.js', 'auth-bootstrap.js', 'tests/**', '.github/workflows/parser-regression.yml']
  pull_request:
    paths: ['app.js', 'xtra-history.js', 'parser-audit.js', 'bulk-performance.js', 'folder-upload.js', 'supply-lifecycle.js', 'auth-bootstrap.js', 'tests/**', '.github/workflows/parser-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.js
          node --check parser-audit.js
          node --check bulk-performance.js
          node --check folder-upload.js
          node --check supply-lifecycle.js
      - name: Run synthetic regression cases
        run: node --test tests/power-regression.test.cjs tests/pdf-lifecycle.test.cjs tests/xtra-completeness.test.cjs tests/supply-lifecycle.test.cjs
