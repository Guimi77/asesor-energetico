name: Parser regression
on:
  push:
    paths: ['app.js', 'invoice-formats.js', 'reading-status.js', 'xtra-history.js', 'parser-audit.js', 'bulk-performance.js', 'folder-upload.js', 'supply-enricher-v2.js', 'supply-source-guard.js', 'supply-lifecycle.js', 'lifecycle-analysis-guard.js', 'analysis-ui.js', 'alerts-ui.js', 'human-language.js', 'auth-bootstrap.js', 'tests/**', '.github/workflows/parser-regression.yml']
  pull_request:
    paths: ['app.js', 'invoice-formats.js', 'reading-status.js', 'xtra-history.js', 'parser-audit.js', 'bulk-performance.js', 'folder-upload.js', 'supply-enricher-v2.js', 'supply-source-guard.js', 'supply-lifecycle.js', 'lifecycle-analysis-guard.js', 'analysis-ui.js', 'alerts-ui.js', 'human-language.js', 'auth-bootstrap.js', 'tests/**', '.github/workflows/parser-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  power-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.js
          node --check invoice-formats.js
          node --check reading-status.js
          node --check parser-audit.js
          node --check bulk-performance.js
          node --check folder-upload.js
          node --check supply-enricher-v2.js
          node --check supply-source-guard.js
          node --check supply-lifecycle.js
          node --check lifecycle-analysis-guard.js
          node --check analysis-ui.js
          node --check alerts-ui.js
          node --check human-language.js
      - name: Run synthetic regression cases
        run: node --test tests/power-regression.test.cjs tests/pdf-lifecycle.test.cjs tests/xtra-completeness.test.cjs tests/supply-lifecycle.test.cjs tests/lifecycle-analysis-guard.test.cjs tests/alerts-ui.test.cjs tests/invoice-formats.test.cjs tests/reading-status.test.cjs
