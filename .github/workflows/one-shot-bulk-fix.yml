name: One-shot bulk PDF performance fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-bulk-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch bulk processing without changing parser logic
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          old_pdf = "async function pdfData(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[],rawPages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();rawPages.push(c.items);pages.push(lines(c.items))}return{pages,rawPages,text:pages.flat().join('\\n')}}"
          new_pdf = "async function pdfData(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[],rawPages=[];try{for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();rawPages.push(c.items);pages.push(lines(c.items));p.cleanup?.()}return{pages,rawPages,text:pages.flat().join('\\n')}}finally{try{await pdf.destroy()}catch{}}}"
          if old_pdf not in s:
              raise SystemExit('app.js pdfData target not found')
          s = s.replace(old_pdf, new_pdf, 1)

          old_process = "async function process(files){for(const file of [...files]){if(!file.name.toLowerCase().endsWith('.pdf'))continue;try{const r=parseFenie(await pdfData(file),file),k=cleanKey(r.invoiceNumber);if(!(k&&k!==cleanKey('Por identificar')&&rows.some(x=>cleanKey(x.invoiceNumber)===k)))rows.push(r)}catch(e){console.warn('Error leyendo',file.name,e)}render()}}"
          new_process = "async function process(files){const list=[...files].filter(file=>file.name.toLowerCase().endsWith('.pdf'));let done=0;for(const file of list){try{const r=parseFenie(await pdfData(file),file),k=cleanKey(r.invoiceNumber);if(!(k&&k!==cleanKey('Por identificar')&&rows.some(x=>cleanKey(x.invoiceNumber)===k)))rows.push(r)}catch(e){console.warn('Error leyendo',file.name,e)}done++;if(done%10===0||done===list.length){render();await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,0)))}}}"
          if old_process not in s:
              raise SystemExit('app.js process target not found')
          s = s.replace(old_process, new_process, 1)
          app.write_text(s, encoding='utf-8')

          hist = Path('xtra-history.js')
          h = hist.read_text(encoding='utf-8')
          old_read = """async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[],raw=[];
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){const p=await pdf.getPage(i),c=await p.getTextContent();raw.push(c.items);pages.push(lines(c.items))}
  return {pages,raw,text:pages.flat().join('\\n')};
}"""
          new_read = """async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[],raw=[];
  try{
    for(let i=1;i<=Math.min(pdf.numPages,3);i++){const p=await pdf.getPage(i),c=await p.getTextContent();raw.push(c.items);pages.push(lines(c.items));p.cleanup?.()}
    return {pages,raw,text:pages.flat().join('\\n')};
  }finally{
    try{await pdf.destroy()}catch{}
  }
}"""
          if old_read not in h:
              raise SystemExit('xtra-history.js readPdf target not found')
          h = h.replace(old_read, new_read, 1)
          hist.write_text(h, encoding='utf-8')
          PY

          node --check app.js
          node --check xtra-history.js
          node --test tests/power-regression.test.cjs
      - name: Commit performance fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js xtra-history.js
          git commit -m 'Prevent browser freeze on large PDF batches'
          git push
