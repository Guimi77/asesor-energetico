name: Refacturation patch helper
on:
  push:
    branches: ['fix/refacturation-dedupe-20260917']
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[refacturation-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/refacturation-dedupe-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow refacturation patch
        run: python3 tools/patch-refacturation-dedupe.py
      - name: Verify syntax and focused regression
        run: |
          node --check app.js
          node --check invoice-supersession.js
          node --test tests/invoice-supersession.test.cjs tests/fenie-ocr-fallback.test.cjs tests/client-report-export.test.cjs tests/power-regression.test.cjs
      - name: Commit tested patch
        run: |
          if git diff --quiet app.js index.html; then
            echo 'No production changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Aplicar deduplicación segura de refacturaciones [refacturation-patched]'
          git push origin HEAD:fix/refacturation-dedupe-20260917
