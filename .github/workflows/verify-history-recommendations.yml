name: Verify history recommendations candidate
on:
  push:
    branches: ['feat/history-recommendations']
    paths: ['history-recommendations.js', 'history-recommendations.css', 'scripts/prepare-history-recommendations.cjs', 'tests/history-recommendations*', '.github/workflows/verify-history-recommendations.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated integration
        run: node scripts/prepare-history-recommendations.cjs
      - name: Syntax and regressions
        run: |
          node --check history-recommendations.js
          node --check history-ui.js
          node --check auth-bootstrap.js
          node --test tests/power-regression.test.cjs tests/pdf-lifecycle.test.cjs tests/history-recommendations.test.cjs
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify history integration with synthetic records
        run: node tests/history-recommendations-browser.cjs
      - name: Commit verified integration on candidate branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history-ui.js auth-bootstrap.js index.html
          git diff --cached --check
          git commit -m 'Integrate tested read-only recommendations in history'
          git push origin HEAD:refs/heads/feat/history-recommendations
