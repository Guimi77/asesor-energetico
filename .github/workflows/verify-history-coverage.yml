name: Verify history chart coverage candidate
on:
  push:
    branches: [fix/history-chart-coverage]
permissions:
  contents: write
concurrency:
  group: history-chart-coverage-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare presentation change on candidate only
        run: node scripts/prepare-history-coverage.cjs
      - name: Syntax and all existing regression tests
        run: |
          node --check history-ui.js
          node --check auth-bootstrap.js
          node --test tests/*.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 exceljs@4.4.0 jszip@3.10.1
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check chart coverage, reload, filters, recommendations and Excel downloads
        run: |
          node tests/history-coverage-browser.cjs
          node tests/history-chart-refresh-browser.cjs
          node tests/history-recommendations-browser.cjs
          node tests/history-client-export-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: history-coverage-synthetic
          path: test-output/
          retention-days: 3
      - name: Commit only verified integration on candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history-ui.js auth-bootstrap.js index.html tests/history-chart-refresh.test.cjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate checked chart coverage and readable axes'
            git push origin HEAD:refs/heads/fix/history-chart-coverage
          fi
