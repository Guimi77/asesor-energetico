name: History client Excel export regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: history-client-export-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression tests
        run: |
          node --check history-ui.js
          node --check client-workbook-layout.js
          node --check history-client-export.js
          node --check client-report-export.js
          node --check historical-export-enrichment.js
          node --test tests/history-client-export.test.cjs tests/client-report-export.test.cjs tests/client-workbook-layout.test.cjs tests/historical-export-enrichment.test.cjs
      - name: Install browser and workbook test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 exceljs@4.4.0 jszip@3.10.1
          python -m pip install openpyxl==3.1.5 pillow==11.3.0
      - name: Verify actual workbooks and filtered downloads
        run: |
          node tests/history-client-export-browser.cjs
          node tests/history-holder-provenance-browser.cjs
          python tests/history-client-export-xml.py
          node tests/historical-export-enrichment-exceljs.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: history-client-export-synthetic
          path: test-output/
          retention-days: 7
