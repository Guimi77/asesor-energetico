name: Restore history total cost chart

on:
  push:
    paths:
      - 'tools/restore-history-total-cost-chart.cjs'
      - '.github/workflows/restore-history-total-cost-chart.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'Prepare total cost chart restoration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore chart and regression guard
        run: node tools/restore-history-total-cost-chart.cjs
      - name: Run exporter regression tests
        run: node --test tests/history-client-export.test.cjs
      - name: Commit restored chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history-client-export.js tests/history-client-export.test.cjs
          git rm tools/restore-history-total-cost-chart.cjs .github/workflows/restore-history-total-cost-chart.yml
          git commit -m "Restore total cost per kWh chart in history Excel"
          git push
