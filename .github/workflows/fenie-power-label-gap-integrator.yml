name: FENIE power label gap integrator

on:
  push:
    branches:
      - fix/fenie-power-missing-labels-audit-20260917

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fenie-power-missing-labels-audit-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct temporary integrator target
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-fenie-power-label-gap-fix.py')
          s=p.read_text(encoding='utf-8')
          old="replace_once('app.js', \"script.src='xtra-history.js?v=20260917-powerlabels1';\", \"script.src='xtra-history.js?v=20260917-powerlabels2';\")"
          new="replace_once('auth-bootstrap.js', \"script.src='xtra-history.js?v=20260917-powerlabels1';\", \"script.src='xtra-history.js?v=20260917-powerlabels2';\")"
          if s.count(old)!=1:
              raise SystemExit(f'integrator target mismatch: {s.count(old)}')
          s=s.replace(old,new)
          anchor="replace_once('index.html', 'app.js?v=20260917-powerlabels1', 'app.js?v=20260917-powerlabels2')"
          replacement="replace_once('index.html', 'auth-bootstrap.js?v=20260917-powerlabels1', 'auth-bootstrap.js?v=20260917-powerlabels2')\n"+anchor
          if s.count(anchor)!=1:
              raise SystemExit(f'index anchor mismatch: {s.count(anchor)}')
          p.write_text(s.replace(anchor,replacement),encoding='utf-8')
          PY
      - name: Apply narrow parser fix
        run: python tools/apply-fenie-power-label-gap-fix.py
      - name: Keep FENIE calculation lock narrow and explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/pdf-lifecycle.test.cjs')
          s=p.read_text(encoding='utf-8')
          old=" assert.equal(slice(current,'const find=','const reading='),parserExpected);"
          new="\n".join([
              " const candidate=slice(current,'const find=','const reading=');",
              " assert(candidate.includes('function powerSectionDetails(a,expectedPeriods=0){'));",
              " assert(candidate.includes('const expected=Number(expectedPeriods)||0;'));",
              " assert(candidate.includes('expected?entries.length===expected:entries.length===uniqueLabels.length'));",
              " assert(candidate.includes('powerDetail.entries.length===expectedPowerPeriods'));",
              " assert(candidate.includes('contracted[`P${p}`]=powerDetail.entries[p-1].contractedKw'));",
              " const normalized=candidate",
              "  .replace('function powerSectionDetails(a,expectedPeriods=0){','function powerSectionDetails(a){')",
              "  .replace(\" const expected=Number(expectedPeriods)||0;\\\\n const complete=entries.length>0&&(expected?entries.length===expected:entries.length===uniqueLabels.length);\",\" const complete=entries.length>0&&entries.length===uniqueLabels.length;\")",
              "  .replace(/const expectedPowerPeriods=.*?;const power=/,'const powerDetail=powerSectionDetails(ps),power=');",
              " assert.equal(normalized,parserExpected);",
          ])
          if s.count(old)!=1:
              raise SystemExit(f'FENIE lock assertion mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check app.js
          node --check xtra-history.js
          node --check parser-audit.js
          node --check auth-bootstrap.js
          node --check fenie-ocr-fallback.js
          node --check client-report-export.js
      - name: Parser and history regressions
        run: |
          node --test tests/power-regression.test.cjs tests/fenie-ocr-fallback.test.cjs tests/client-report-export.test.cjs tests/pdf-lifecycle.test.cjs tests/xtra-completeness.test.cjs tests/supply-lifecycle.test.cjs tests/lifecycle-analysis-guard.test.cjs tests/alerts-ui.test.cjs tests/invoice-formats.test.cjs tests/endesa-real-layout-regression.test.cjs tests/endesa-source-validation.test.cjs tests/endesa-power-period-fix.test.cjs tests/endesa-runtime-cache.test.cjs tests/endesa-status-consistency.test.cjs tests/reading-status.test.cjs
          git diff --check
      - name: Commit verified fix
        run: |
          rm .github/workflows/fenie-power-label-gap-integrator.yml
          rm tools/apply-fenie-power-label-gap-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aceptar potencia FENIE completa aunque OCR pierda etiquetas Pn"
          git push origin HEAD:fix/fenie-power-missing-labels-audit-20260917
