name: Historical chart coverage regression
on:
  push:
    branches: [main]
    paths:
      - 'history-ui.js'
      - 'auth-bootstrap.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/history-coverage-regression.yml'
  pull_request:
    paths:
      - 'history-ui.js'
      - 'auth-bootstrap.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/history-coverage-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and numerical regressions
        run: |
          node --check history-ui.js
          node --check auth-bootstrap.js
          node --test tests/*.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 exceljs@4.4.0 jszip@3.10.1
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Coverage, chart reloads, filters, recommendations and XLSX downloads
        run: |
          node tests/history-coverage-browser.cjs
          node tests/history-chart-refresh-browser.cjs
          node tests/history-recommendations-browser.cjs
          node tests/history-client-export-browser.cjs
