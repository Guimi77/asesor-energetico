name: Holder commercial portfolio regression

on:
  pull_request:
    paths:
      - 'supabase/migrations/*holder*sql'
      - 'supabase/migrations/*supply_portfolios.sql'
      - 'supabase/migrations/*client_contact_details.sql'
      - 'tests/holder-portfolio-*'
      - '.github/workflows/holder-portfolio-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*holder*sql'
      - 'supabase/migrations/*supply_portfolios.sql'
      - 'supabase/migrations/*client_contact_details.sql'
      - 'tests/holder-portfolio-*'
      - '.github/workflows/holder-portfolio-regression.yml'

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: holder_portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOLDER_PORTFOLIO_TEST_DATABASE_URL: postgres://postgres:synthetic-test-password@localhost:5432/holder_portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: node --check tests/holder-portfolio-postgres.cjs
      - run: node tests/holder-portfolio-postgres.cjs
