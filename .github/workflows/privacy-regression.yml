name: Privacy regression

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'tools/scan-test-pii.js'
      - 'tools/sanitize-parser-fixture.js'
      - 'tools/privacy-utils.js'
      - 'PRIVACY_POLICY.md'
      - '.github/workflows/privacy-regression.yml'
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/scan-test-pii.js'
      - 'tools/sanitize-parser-fixture.js'
      - 'tools/privacy-utils.js'
      - 'PRIVACY_POLICY.md'
      - '.github/workflows/privacy-regression.yml'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Escanear todos los tests, incluida la deuda histórica conocida'
        required: false
        default: false
        type: boolean

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate privacy tooling
        run: |
          node --check tools/privacy-utils.js
          node --check tools/scan-test-pii.js
          node --check tools/sanitize-parser-fixture.js
          node --test tests/privacy-scanner.test.cjs

      - name: Full privacy scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan == true }}
        run: node tools/scan-test-pii.js --all

      - name: Build changed test file list
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_scan == true) }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only -z --diff-filter=ACMR "$BASE" HEAD -- tests > /tmp/privacy-files.bin
          else
            # A force-push/history rewrite can make github.event.before unreachable.
            # In that case scan the complete current test tree instead of failing
            # before the privacy scanner gets a chance to run.
            find tests -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.json' -o -name '*.txt' -o -name '*.md' -o -name '*.html' \) -print0 > /tmp/privacy-files.bin
          fi

      - name: Scan added or modified tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_scan == true) }}
        run: node tools/scan-test-pii.js --stdin0 < /tmp/privacy-files.bin
