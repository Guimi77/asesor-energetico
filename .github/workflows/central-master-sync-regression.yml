name: Central master sync regression

on:
  push:
    paths:
      - 'supabase-xtra-pilot.js'
      - 'master-v2.js'
      - 'master-v2.js'
      - 'auth-bootstrap.js'
      - 'tests/central-master-sync.test.cjs'
      - '.github/workflows/central-master-sync-regression.yml'
  pull_request:
    paths:
      - 'supabase-xtra-pilot.js'
      - 'auth-bootstrap.js'
      - 'tests/central-master-sync.test.cjs'
      - '.github/workflows/central-master-sync-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/central-master-sync.test.cjs
