name: FENIE OCR power-label integrator
on:
  push:
    branches: ['fix/fenie-ocr-power-labels-client-report-20260917']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fenie-ocr-power-labels-client-report-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused parser fix
        run: python tools/fix-fenie-ocr-power-labels.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check xtra-history.js
          node --check fenie-ocr-fallback.js
          node --check client-report-export.js
          node --check auth-bootstrap.js
      - name: Regression suite
        run: |
          node --test tests/power-regression.test.cjs tests/fenie-ocr-fallback.test.cjs tests/fenie-ocr-integration.test.cjs tests/client-report-export.test.cjs tests/pdf-lifecycle.test.cjs tests/xtra-completeness.test.cjs tests/supply-lifecycle.test.cjs tests/lifecycle-analysis-guard.test.cjs tests/alerts-ui.test.cjs tests/invoice-formats.test.cjs tests/endesa-real-layout-regression.test.cjs tests/endesa-source-validation.test.cjs tests/endesa-power-period-fix.test.cjs tests/endesa-runtime-cache.test.cjs tests/endesa-status-consistency.test.cjs tests/reading-status.test.cjs
      - name: Remove temporary integrator files
        run: rm -f .github/workflows/fenie-power-label-integrator.yml tools/fix-fenie-ocr-power-labels.py
      - name: Commit integrated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js xtra-history.js client-report-export.js auth-bootstrap.js index.html tests/power-regression.test.cjs tests/xtra-completeness.test.cjs tests/pdf-lifecycle.test.cjs .github/workflows/fenie-power-label-integrator.yml tools/fix-fenie-ocr-power-labels.py
          git commit -m 'Corregir falso error de potencia OCR FENIE y desbloquear informe cliente [skip ci]'
          git push origin HEAD:fix/fenie-ocr-power-labels-client-report-20260917
