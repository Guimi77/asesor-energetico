name: History recommendations regression
on:
  push:
    paths: ['history-recommendations*', 'history-ui.js', 'auth-bootstrap.js', 'index.html', 'tests/history-recommendations*', '.github/workflows/history-recommendations-regression.yml']
  pull_request:
    paths: ['history-recommendations*', 'history-ui.js', 'auth-bootstrap.js', 'index.html', 'tests/history-recommendations*', '.github/workflows/history-recommendations-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and regressions
        run: |
          node --check history-recommendations.js
          node --check history-ui.js
          node --check auth-bootstrap.js
          node --test tests/power-regression.test.cjs tests/pdf-lifecycle.test.cjs tests/history-recommendations.test.cjs tests/history-reactive.test.cjs
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify integration on synthetic historical data
        run: node tests/history-recommendations-browser.cjs
