name: Bump Endesa period cache

on:
  push:
    paths:
      - '.github/workflows/bump-endesa-period-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump browser cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'endesa-power-period-fix.js?v=20260915-1'
          new = 'endesa-power-period-fix.js?v=20260915-2'
          if old not in s:
              raise SystemExit('Expected Endesa period cache key not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load corrected Endesa period prices' || exit 0
          git push
