name: i18n-ui-regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'i18n.js'
      - 'styles.css'
      - 'tests/i18n-ui.test.cjs'
      - '.github/workflows/i18n-ui-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'i18n.js'
      - 'styles.css'
      - 'tests/i18n-ui.test.cjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check i18n.js
      - run: node --check analysis-ui.js
      - run: node --check alerts-ui.js
      - run: node tests/i18n-ui.test.cjs
